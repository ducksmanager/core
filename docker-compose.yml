services:
  caddy:
    container_name: caddy
    image: caddy-ratelimit
    # Stock Caddy plus the rate_limit directive, used by apps/quackinator/Caddyfile
    build:
      dockerfile_inline: |
        FROM caddy:2-builder AS builder
        RUN xcaddy build --with github.com/mholt/caddy-ratelimit
        FROM caddy:2
        COPY --from=builder /usr/bin/caddy /usr/bin/caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ../apps:/etc/caddy/apps
      - /data:/server-data:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - public-network

volumes:
  caddy_data:
  caddy_config:

networks:
  public-network:
    name: public-network
