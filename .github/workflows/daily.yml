name: "DucksManager daily"

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
jobs:
  ducksmanager-daily:
    runs-on: ubuntu-latest
    environment: production
    env:
      REMOTE_ROOT: apps/dm
      PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
      # Every remote command is bounded so that a hung container dies on the
      # production host instead of outliving the step that started it.
      # REMOTE_PULL_TIMEOUT + REMOTE_TIMEOUT must stay below timeout-minutes.
      REMOTE_PULL_TIMEOUT: 2m
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.8.0

      - name: Use Node.js 26
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          pnpm -r i

      - name: Run coa-updater
        timeout-minutes: 40
        env:
          REMOTE_TIMEOUT: 35m
        run: |
          pnpm -r -F '~coa-updater' prod:docker-compose-run

      - name: Run stats-updater
        timeout-minutes: 90
        continue-on-error: true
        env:
          REMOTE_TIMEOUT: 85m
        run: |
          pnpm -r -F '~stats-updater' prod:docker-compose-run

      - name: Run cover-updater
        timeout-minutes: 20
        continue-on-error: true
        env:
          REMOTE_TIMEOUT: 15m
        run: |
          pnpm -r -F '~cover-updater' prod:docker-compose-run

      - name: Run duck-estimator
        timeout-minutes: 90
        continue-on-error: true
        env:
          REMOTE_TIMEOUT: 80m
        run: |
          pnpm -r -F '~duck-estimator' prod:docker-compose-run

      - name: Run sprite-names-updater
        timeout-minutes: 5
        continue-on-error: true
        env:
          REMOTE_TIMEOUT: 2m
        run: |
          pnpm -r -F '~edgecreator-api' prod:run:sprite-names-updater

      - name: Run subscription-handler
        timeout-minutes: 5
        continue-on-error: true
        env:
          REMOTE_TIMEOUT: 2m
        run: |
          pnpm -r -F '~api' prod:docker-compose-run-create-issues-from-subscriptions
