name: "DucksManager backup"

on:
  workflow_run:
    workflows: ["DucksManager daily"]
    types:
      - completed
  workflow_dispatch:
jobs:
  ducksmanager-backup:
    runs-on: ubuntu-latest
    environment: production
    env:
      REMOTE_ROOT: apps/dm
      PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
      REMOTE_PULL_TIMEOUT: 2m
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: false

      - name: Install Node.js, pnpm and Bun from mise.toml
        uses: jdx/mise-action@v3

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          pnpm -r i

      - name: Run backup
        timeout-minutes: 10
        env:
          REMOTE_TIMEOUT: 7m
        run: |
          pnpm -r -F '~backup' prod:docker-compose-run
